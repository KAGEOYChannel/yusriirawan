name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Vite hanya membangun index.html & pembelajaranMTK.html (satu-satunya
      # entry yang didaftarkan di vite.config.ts). Halaman/aset statis lama
      # lainnya tidak pernah ikut Vite, jadi disalin apa adanya ke dist/
      # di sini supaya tetap bisa diakses di GitHub Pages.
      - name: Copy legacy static files
        run: |
          find . -maxdepth 1 -type f \
            ! -name 'package.json' \
            ! -name 'package-lock.json' \
            ! -name 'bun.lock' \
            ! -name 'tsconfig.json' \
            ! -name 'vite.config.ts' \
            ! -name '_config.yml' \
            ! -name 'metadata.json' \
            ! -name 'README.md' \
            ! -name 'PERBAIKAN.md' \
            ! -name 'index.html' \
            ! -name 'pembelajaranMTK.html' \
            -exec cp {} dist/ \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
