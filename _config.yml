# Konfigurasi Jekyll untuk GitHub Pages
# File ini membuat URL halaman/post menjadi "pretty" tanpa ekstensi .html

# Contoh: about.html -> namadomain.com/about/
permalink: pretty

# --- Pengaturan dasar situs (opsional, sesuaikan) ---
title: "Nama Situs Saya"
description: "Deskripsi singkat tentang situs ini"
url: "https://yusriirawan.my.id"    # ganti dengan custom domain kamu
baseurl: ""                      # kosongkan jika pakai custom domain di root

# --- Tema bawaan GitHub Pages (opsional) ---
# theme: minima

# --- File/folder yang tidak perlu diproses Jekyll ---
exclude:
  - README.md
  - PERBAIKAN.md
  - LICENSE
  - .gitignore
  - node_modules
  # Source code dev aplikasi pembelajaran (React/TS mentah). Tidak perlu
  # ikut dipublish langsung — GitHub Actions
  # (.github/workflows/build-pembelajaran.yml) meng-compile isi folder
  # ini lalu meng-commit hasilnya ke pembelajaranMTK.html + assets/ di
  # root, dan itulah yang benar-benar disajikan ke pengunjung.
  - app
