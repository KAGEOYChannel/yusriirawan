# Konfigurasi Jekyll untuk GitHub Pages
# File ini membuat URL halaman/post menjadi "pretty" tanpa ekstensi .html

# Contoh: about.html -> namadomain.com/about/
permalink: pretty

# --- Pengaturan dasar situs (opsional, sesuaikan) ---
title: "AWAN | Yusri Irawan - Portfolio & Media Pembelajaran"
description: "Portal resmi, portofolio dan media pembelajaran interaktif Matematika & TIK oleh Yusri Irawan"
url: "https://yusriirawan.my.id"    # ganti dengan custom domain kamu
baseurl: ""                      # kosongkan jika pakai custom domain di root

# --- Tema bawaan GitHub Pages (opsional) ---
# theme: minima

# --- File/folder yang tidak perlu diproses Jekyll ---
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - node_modules
  # Source code dev aplikasi pembelajaran (di-build otomatis oleh
  # GitHub Actions ke pembelajaran/, tidak perlu ikut dipublish)
  - pembelajaran/app
